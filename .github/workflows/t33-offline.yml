name: T33 offline probe tests

on:
  push:
    branches:
      - codex/t33-auto-sampling
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  t33-offline:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Run offline probe tests
        run: python tools/tests/test_urdf_axis_probe.py -v
      - name: Compile probe
        run: python -m py_compile tools/dm-exo/urdf_fk_calib/urdf_axis_probe.py tools/tests/test_urdf_axis_probe.py
      - name: Check patch whitespace
        run: git diff --check
